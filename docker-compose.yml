services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: job_intelligence
    ports:
      - "5435:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
  app:
    build: .
    command: uvicorn freelance_job_intelligence_system.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8003:8000"
    depends_on:
      - postgres
      - redis
  dashboard:
    build: .
    command: streamlit run dashboard/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    volumes:
      - .:/app
    ports:
      - "8504:8501"
    depends_on:
      - app
